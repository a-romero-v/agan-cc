/products:
  get:
    tags: [Products]
    summary: List the products, one page at a time
    description: |
      Ordered by name. A page behind the last one is not an error: it has no items.
    operationId: listProducts
    security: []
    parameters:
      - name: page
        in: query
        description: Page number, starting at 1
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: perPage
        in: query
        description: Number of products per page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: One page of the product catalogue
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductListView'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'
