ProductView:
  type: object
  required: [id, name, price, taxRateBp]
  properties:
    id:
      type: string
      format: uuid
      example: '019a7f3e-4a0b-7b29-8c1d-3e5f7a9b0c1d'
    name:
      type: string
      example: Espresso Cup
    price:
      description: Gross unit price
      allOf:
        - $ref: '#/components/schemas/Money'
    taxRateBp:
      type: integer
      description: VAT rate in basis points (1900 = 19 %)
      minimum: 0
      example: 1900
