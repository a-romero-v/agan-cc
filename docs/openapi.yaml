openapi: 3.0.3
info:
  title: 'Shopping Cart API'
  description: "Shopping cart REST API: guest and registered carts, a read-only product catalogue and stock reservation.\n\nAll monetary amounts are integers in the smallest currency unit (cents) plus a currency.\nAll IDs are UUIDs. Errors are RFC 9457 Problem Details with a numeric `errorCode`.\n"
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
    description: 'Local dev server'
tags:
  -
    name: Carts
    description: 'Create, view and modify a cart'
  -
    name: Products
    description: 'Read-only product catalogue'
  -
    name: Auth
    description: 'Login for registered users'
security:
  -
    cartToken: []
  -
    jwt: []
components:
  securitySchemes:
    cartToken:
      type: http
      scheme: bearer
      description: "Guest access. The opaque cart token (prefix `cart_`) is returned once by `POST /carts`\nand grants access to exactly that cart.\n"
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Registered users. The JWT is issued by `POST /auth/login`.'
  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 019a7f3e-5b1c-7c3a-9d2e-4f6a8b0c1d2e
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 019a7f3e-6c2d-7d4b-8e3f-5a7b9c1d2e3f
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 019a7f3e-4a0b-7b29-8c1d-3e5f7a9b0c1d
  headers:
    RetryAfter:
      description: 'Seconds to wait before the next attempt'
      schema:
        type: integer
        minimum: 1
      example: 30
  responses:
    BadRequest:
      description: 'Malformed request, e.g. invalid JSON (`errorCode` 4003)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: 'about:blank'
            title: 'Bad Request'
            status: 400
            detail: 'The request body is not valid JSON.'
            errorCode: 4003
    Unauthorized:
      description: 'Missing or invalid credentials (`errorCode` 4004)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: 'about:blank'
            title: Unauthorized
            status: 401
            detail: 'Missing or invalid credentials.'
            errorCode: 4004
    NotFound:
      description: "The resource does not exist or belongs to someone else. Both cases are answered\nidentically, so the existence of a foreign cart is not revealed.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: 'about:blank'
            title: 'Not Found'
            status: 404
            detail: 'Resource not found.'
            errorCode: 4001
    Conflict:
      description: 'Insufficient stock, or the cart was modified concurrently'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: 'The request body is not `application/json` (`errorCode` 4006)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: 'about:blank'
            title: 'Unsupported Media Type'
            status: 415
            detail: 'The request body must be application/json.'
            errorCode: 4006
    UnprocessableEntity:
      description: "Validation error (`errorCode` 4002, with `violations`) or a violated business rule\n(context-specific `errorCode`, without `violations`)\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: 'about:blank'
            title: 'Unprocessable Content'
            status: 422
            detail: 'The request is invalid.'
            errorCode: 4002
            violations:
              -
                field: quantity
                message: 'This value should be between 1 and 99.'
    TooManyRequests:
      description: 'Rate limit exceeded (`errorCode` 4007)'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: 'about:blank'
            title: 'Too Many Requests'
            status: 429
            detail: 'Rate limit exceeded.'
            errorCode: 4007
  schemas:
    AddCartItemInput:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
          example: 019a7f3e-4a0b-7b29-8c1d-3e5f7a9b0c1d
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
    CartItemView:
      type: object
      required:
        - id
        - productId
        - productName
        - quantity
        - unitPrice
        - taxRateBp
        - total
        - reserved
      properties:
        id:
          type: string
          format: uuid
          description: 'The item ID used in the item endpoints'
          example: 019a7f3e-6c2d-7d4b-8e3f-5a7b9c1d2e3f
        productId:
          type: string
          format: uuid
          example: 019a7f3e-4a0b-7b29-8c1d-3e5f7a9b0c1d
        productName:
          type: string
          example: 'Espresso Cup'
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 3
        unitPrice:
          description: 'Current gross catalogue price, not a snapshot from when the item was added'
          allOf:
            -
              $ref: '#/components/schemas/Money'
        taxRateBp:
          type: integer
          description: 'VAT rate in basis points (1900 = 19 %)'
          minimum: 0
          example: 1900
        total:
          description: 'Line total (unit price × quantity) with its net amount and VAT'
          allOf:
            -
              $ref: '#/components/schemas/MoneyBreakdown'
        reserved:
          type: boolean
          description: 'Whether stock is currently reserved for this item. Items that are not reserved are excluded from the cart totals.'
          example: true
    CartView:
      type: object
      required:
        - id
        - items
        - totals
      properties:
        id:
          type: string
          format: uuid
          example: 019a7f3e-5b1c-7c3a-9d2e-4f6a8b0c1d2e
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemView'
        totals:
          description: 'Sum over all reserved items. Items with `reserved: false` are excluded.'
          allOf:
            -
              $ref: '#/components/schemas/MoneyBreakdown'
    CreatedCartView:
      description: 'The cart as returned by `POST /carts`. Guests additionally receive the cart token, exactly once.'
      allOf:
        -
          $ref: '#/components/schemas/CartView'
        -
          type: object
          properties:
            token:
              type: string
              description: 'Cart token for guests (`Authorization: Bearer <token>`). Absent for registered users.'
              pattern: ^cart_
              example: cart_3q2-7wEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
    ChangeCartItemQuantityInput:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          description: 'The new absolute quantity'
          minimum: 1
          maximum: 99
          example: 7
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          example: secret123
    LoginView:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: 'JWT, valid for one hour'
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
    Money:
      description: 'An amount in the smallest unit of its currency (cents). Never a float.'
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          example: 999
        currency:
          type: string
          description: 'ISO 4217 code'
          pattern: '^[A-Z]{3}$'
          example: EUR
    MoneyBreakdown:
      description: 'A gross amount with the net amount and the VAT it includes (gross = net + vat).'
      type: object
      required:
        - gross
        - net
        - vat
      properties:
        gross:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        vat:
          $ref: '#/components/schemas/Money'
    ProblemDetails:
      description: 'RFC 9457 Problem Details, extended by `errorCode` and, for validation errors, `violations`.'
      type: object
      required:
        - type
        - title
        - status
        - errorCode
      properties:
        type:
          type: string
          description: 'URI reference identifying the problem type'
          example: 'about:blank'
        title:
          type: string
          example: 'Unprocessable Content'
        status:
          type: integer
          description: 'The HTTP status code of this response'
          example: 422
        detail:
          type: string
          example: 'Quantity must be between 1 and 99.'
        errorCode:
          type: integer
          description: "Stable numeric code: 1xxx Cart, 2xxx Product, 3xxx User, 4xxx generic, 5xxx Inventory.\n"
          example: 4002
        violations:
          type: array
          description: 'Present on validation errors only (`errorCode` 4002)'
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: quantity
        message:
          type: string
          example: 'This value should be between 1 and 99.'
    ProductView:
      type: object
      required:
        - id
        - name
        - price
        - taxRateBp
      properties:
        id:
          type: string
          format: uuid
          example: 019a7f3e-4a0b-7b29-8c1d-3e5f7a9b0c1d
        name:
          type: string
          example: 'Espresso Cup'
        price:
          description: 'Gross unit price'
          allOf:
            -
              $ref: '#/components/schemas/Money'
        taxRateBp:
          type: integer
          description: 'VAT rate in basis points (1900 = 19 %)'
          minimum: 0
          example: 1900
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: 'Log in and receive a JWT'
      description: 'A failed login is answered identically for an unknown user and a wrong password.'
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        200:
          description: 'JWT issued'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginView'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/carts/{cartId}/items':
    post:
      tags:
        - Carts
      summary: 'Add an item to the cart'
      description: "Adding a product that is already in the cart increases the quantity of the existing item.\nStock for the resulting quantity is reserved synchronously.\n"
      operationId: addCartItem
      parameters:
        -
          $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemInput'
      responses:
        201:
          description: 'A new item was created'
          headers:
            Location:
              description: 'URL of the new item'
              schema:
                type: string
              example: /carts/019a7f3e-5b1c-7c3a-9d2e-4f6a8b0c1d2e/items/019a7f3e-6c2d-7d4b-8e3f-5a7b9c1d2e3f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartView'
        200:
          description: 'The quantity of the existing item was increased'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartView'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/carts/{cartId}/items/{itemId}':
    patch:
      tags:
        - Carts
      summary: 'Change the quantity of an item'
      description: "Sets the absolute quantity. An increase reserves the additional stock synchronously;\na decrease releases stock asynchronously. The body is `application/json`, not a merge patch.\n"
      operationId: changeCartItemQuantity
      parameters:
        -
          $ref: '#/components/parameters/CartId'
        -
          $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCartItemQuantityInput'
      responses:
        200:
          description: 'The updated cart'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartView'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Carts
      summary: 'Remove an item from the cart'
      description: "The item's stock reservation is released asynchronously."
      operationId: removeCartItem
      parameters:
        -
          $ref: '#/components/parameters/CartId'
        -
          $ref: '#/components/parameters/ItemId'
      responses:
        204:
          description: 'Item removed'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /carts:
    post:
      tags:
        - Carts
      summary: "Create a guest cart, or return the registered user's cart"
      description: "Without credentials a new guest cart is created and its cart token is returned exactly once.\nWith a JWT the user's cart is returned, and created first if it does not exist (idempotent).\nA present but invalid `Authorization` header is answered with 401; it never creates a guest cart.\n"
      operationId: createCart
      security:
        - {}
        -
          jwt: []
      responses:
        201:
          description: 'Cart created'
          headers:
            Location:
              description: 'URL of the cart'
              schema:
                type: string
              example: /carts/019a7f3e-5b1c-7c3a-9d2e-4f6a8b0c1d2e
            Cache-Control:
              description: 'Always `no-store`, because the body can carry the cart token'
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCartView'
        200:
          description: 'The registered user already has a cart'
          headers:
            Location:
              description: 'URL of the cart'
              schema:
                type: string
              example: /carts/019a7f3e-5b1c-7c3a-9d2e-4f6a8b0c1d2e
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCartView'
        401:
          $ref: '#/components/responses/Unauthorized'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/carts/{cartId}':
    get:
      tags:
        - Carts
      summary: 'View a cart with its items, reservation status and totals'
      description: 'Viewing a cart changes nothing; in particular it does not extend reservations.'
      operationId: getCart
      parameters:
        -
          $ref: '#/components/parameters/CartId'
      responses:
        200:
          description: 'The cart'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartView'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/products/{productId}':
    get:
      tags:
        - Products
      summary: 'Get a product by ID'
      operationId: getProduct
      security: []
      parameters:
        -
          $ref: '#/components/parameters/ProductId'
      responses:
        200:
          description: 'The product'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        404:
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      tags:
        - Products
      summary: 'List all products'
      operationId: listProducts
      security: []
      responses:
        200:
          description: 'The product catalogue'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductView'
