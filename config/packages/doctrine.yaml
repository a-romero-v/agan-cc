doctrine:
    dbal:
        # SQLite; the file name contains the environment (var/data_dev.db, var/data_test.db).
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        options:
            # Every transaction starts as BEGIN IMMEDIATE: the write lock is taken up front, so
            # check-then-write sequences cannot interleave and a later lock upgrade cannot fail (R14).
            !php/const Pdo\Sqlite::ATTR_TRANSACTION_MODE: !php/const Pdo\Sqlite::TRANSACTION_MODE_IMMEDIATE
            # Seconds to wait for the write lock before failing with "database is locked".
            !php/const PDO::ATTR_TIMEOUT: 5
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: false
        # One "type: attribute" mapping per bounded context, pointing at <Context>/Infrastructure/Persistence.
        # Added together with the first Record of each context.
        mappings: {}

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
